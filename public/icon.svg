<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#070b19"/>
      <stop offset="100%" stop-color="#050711"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="violet-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle with safe margin -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="#06b6d4" stroke-width="6" opacity="0.4"/>

  <!-- Shield Crest Background -->
  <path d="M256 64 L416 128 C416 290 348 400 256 448 C164 400 96 290 96 128 Z" 
        fill="#0f172a" stroke="url(#cyan-glow)" stroke-width="8" filter="url(#glow)"/>

  <!-- Crossed Swords -->
  <g stroke="url(#cyan-glow)" stroke-width="10" stroke-linecap="round">
    <line x1="160" y1="160" x2="352" y2="352"/>
    <line x1="352" y1="160" x2="160" y2="352"/>
    <line x1="140" y1="180" x2="180" y2="140"/>
    <line x1="332" y1="140" x2="372" y2="180"/>
  </g>

  <!-- Anime Star / Crown Emblem -->
  <polygon points="256,150 274,204 330,204 286,238 302,292 256,260 210,292 226,238 182,204 238,204" 
           fill="url(#cyan-glow)" filter="url(#glow)"/>

  <!-- AQ Monogram Text -->
  <text x="256" y="380" font-family="'Cinzel Decorative', 'Rajdhani', sans-serif" font-size="64" font-weight="900" 
        fill="#ffffff" text-anchor="middle" letter-spacing="4" filter="url(#glow)">ANIME</text>
  <text x="256" y="420" font-family="'Cinzel Decorative', 'Rajdhani', sans-serif" font-size="34" font-weight="800" 
        fill="#38bdf8" text-anchor="middle" letter-spacing="6">QUEST</text>
</svg>
